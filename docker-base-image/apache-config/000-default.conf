<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName localhost
    
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Lo storage resta fuori dalla DocumentRoot ma mantiene l'URL pubblico /storage/.
    Alias /storage/ /var/www/html/storage/
    <Directory /var/www/html/storage>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch \.php$>
            Require all denied
        </FilesMatch>
    </Directory>
    
    # Log files
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # PHP configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

# Configurazione HTTPS - ora funzionante con certificati generati automaticamente
<VirtualHost *:443>
    DocumentRoot /var/www/html/public
    ServerName localhost
    
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    
    # Configurazioni SSL di sicurezza
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /storage/ /var/www/html/storage/
    <Directory /var/www/html/storage>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch \.php$>
            Require all denied
        </FilesMatch>
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
    
    # PHP configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>
